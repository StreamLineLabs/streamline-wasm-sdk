# Docker Compose for WASM SDK integration testing
# Usage: docker compose -f docker-compose.test.yml up -d
services:
  streamline:
    image: "${STREAMLINE_FIXTURE_IMAGE:?Set STREAMLINE_FIXTURE_IMAGE to a published fixture image}"
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      - STREAMLINE_LOG_LEVEL=info
