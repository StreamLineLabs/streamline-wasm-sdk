[package]
name = "streamline-wasm-sdk"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Browser-native WebAssembly SDK for Streamline streaming platform"
license = "Apache-2.0"
repository = "https://github.com/streamlinelabs/streamline-wasm-sdk"
homepage = "https://github.com/streamlinelabs/streamline-wasm-sdk"
readme = "README.md"
keywords = ["wasm", "webassembly", "streaming", "kafka"]
categories = ["wasm", "web-programming", "asynchronous"]
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
live-browser-tests = []

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["BinaryType", "WebSocket", "MessageEvent", "console", "ErrorEvent", "CloseEvent", "Performance", "Window", "Headers", "Request", "RequestInit", "RequestMode", "Response"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"


[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[lints.rust]
# Cargo 1.80's generated check-cfg list does not yet include cfg(test), even
# for --all-targets. Declare it explicitly so the MSRV lint gate can still
# deny genuinely unexpected cfg names.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test)"] }
