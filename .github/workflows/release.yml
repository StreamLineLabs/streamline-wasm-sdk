name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  quality:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target — required for #[cfg(target_arch = "wasm32")] code)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  tests:
    name: Native and Browser Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          targets: wasm32-unknown-unknown
      - run: cargo test
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: wasm-pack test --headless --chrome

  security:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  browser-gate:
    name: Mandatory Live-Browser Gate
    uses: ./.github/workflows/integration.yml

  package-checks:
    name: Version and Package Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Verify tag, Cargo, and npm versions
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "streamline-wasm-sdk") | .version')"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$CARGO_VERSION"
          test "$TAG_VERSION" = "$NPM_VERSION"
          echo "Validated release version $TAG_VERSION"
      - name: Build web and bundler packages
        run: npm run build
      - name: Verify declaration and notice surface
        run: |
          test -f NOTICE
          test -f pkg/streamline_wasm_sdk.js
          test -f pkg/streamline_wasm_sdk_bg.wasm
          test -f pkg/streamline_wasm_sdk.d.ts
          grep -q "export class StreamlineClient" pkg/streamline_wasm_sdk.d.ts
          grep -q "on_reconnect_failed" pkg/streamline_wasm_sdk.d.ts
          grep -q "set_max_reconnect_attempts" pkg/streamline_wasm_sdk.d.ts
      - name: Inspect npm package contents
        run: npm pack --dry-run

  release:
    name: Publish npm and GitHub Release
    needs: [quality, tests, security, browser-gate, package-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Build npm package
        run: npm run build
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          artifact-name: sbom-streamline-wasm-sdk.spdx.json
          output-file: sbom-streamline-wasm-sdk.spdx.json
      - name: Publish to npm with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom-streamline-wasm-sdk.spdx.json
