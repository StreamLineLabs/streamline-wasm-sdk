name: CI

on:
  push:
  pull_request:

env:
  WASM_BINDGEN_TEST_TIMEOUT: 120

jobs:
  check:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (wasm32 target — required for #[cfg(target_arch = "wasm32")] code)
        run: cargo clippy --all-targets --target wasm32-unknown-unknown -- -D warnings

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
      - run: cargo test

  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Build WASM (web target)
        run: wasm-pack build --target web --release
      - name: Build WASM (bundler target)
        run: wasm-pack build --target bundler --release --out-dir pkg-bundler
      - name: Verify TypeScript definitions
        run: test -f pkg/streamline_wasm_sdk.d.ts

  wasm-test:
    name: WASM Browser Tests (${{ matrix.test-target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-target:
          - browser
          - browser_reconnect
          - protocol_edge_cases
          - reconnection
          - web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.80"
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - name: Run WASM tests (headless Chrome)
        run: wasm-pack test --headless --chrome . --test "${{ matrix.test-target }}"

  security:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # cargo-audit 0.22.2 requires Rust 1.88. Crate MSRV checks remain
          # pinned to Rust 1.80 in the check, test, and build jobs above.
          toolchain: "1.88"
      - name: Install pinned cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependencies
        run: cargo audit --deny unsound
      - name: Enforce dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
