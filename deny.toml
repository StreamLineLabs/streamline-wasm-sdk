# cargo-deny configuration
# Run with: cargo deny check

[graph]
targets = [
    "wasm32-unknown-unknown",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "warn"
unused-ignored-advisory = "warn"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { crate = "openssl", reason = "Browser WASM builds must not introduce native OpenSSL" },
    { crate = "openssl-sys", reason = "Browser WASM builds must not introduce native OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
